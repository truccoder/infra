services:
  # Ngân sách bộ nhớ cho VPS 4 GB (Vietnix Cheap 2, 2 vCPU / 4 GB).
  #
  #   caddy    96m + backend 1024m + web-ui 448m + redis 192m + neo4j 640m + minio 384m = 2784m
  #
  # Còn lại khoảng 1.2 GB cho hệ điều hành và page cache. Trước đây KHÔNG service nào có giới hạn,
  # nghĩa là cả sáu đều tưởng mình được dùng trọn 4 GB; khi cộng lại vượt quá thì OOM-killer của
  # nhân hệ điều hành chọn nạn nhân theo điểm số của nó, thường là tiến trình lớn nhất — tức là
  # backend — và container biến mất mà không để lại stack trace nào.
  #
  # Con số của backend gắn với -XX:MaxRAMPercentage=75.0 trong Dockerfile: 1024m × 75% = 768m heap,
  # phần còn lại dành cho metaspace, stack luồng và bộ đệm trực tiếp. Sửa mem_limit ở đây là heap
  # tự đổi theo, không phải chỉnh hai chỗ.

  # ─── Reverse Proxy ───
  caddy:
    image: caddy:2-alpine
    mem_limit: 96m
    # Caddyfile đọc {$PUBLIC_DOMAIN} từ môi trường của CHÍNH tiến trình caddy, không phải từ phép
    # thay biến của Compose. Không truyền vào đây thì đặt PUBLIC_DOMAIN trong .env sẽ không có tác
    # dụng gì — Caddy lặng lẽ dùng giá trị mặc định `:80` và không báo lỗi, nên sẽ trông như
    # "đã bật domain rồi mà vẫn chạy HTTP".
    #
    # ⚠️ `:-:80`, KHÔNG phải `:-`. Chính chỗ này làm sập production ngày 2026-08-22.
    #
    # Caddyfile khai báo `{$PUBLIC_DOMAIN::80}` với ý "trống thì nghe :80". Nhưng giá trị mặc định
    # của Caddy CHỈ áp dụng khi biến KHÔNG TỒN TẠI. Biến tồn tại nhưng rỗng thì Caddy thay vào
    # đúng chuỗi rỗng — và `${PUBLIC_DOMAIN:-}` ở đây luôn TẠO RA biến đó với giá trị rỗng.
    #
    # Dòng địa chỉ site vì thế rút lại còn mỗi ` {`, mà một Caddyfile mở đầu bằng `{` được hiểu là
    # khối global options. Chỉ thị đầu tiên bên trong lập tức sai ngữ cảnh:
    #
    #   Error: adapting config using caddyfile: /etc/caddy/Caddyfile:21: unrecognized global option: handle
    #
    # Caddy thoát, `restart: always` bật lại, lặp vô hạn — nghĩa là KHÔNG AI nghe cổng 80 và trình
    # duyệt báo ERR_CONNECTION_REFUSED. Năm service còn lại vẫn khỏe, `docker compose up -d` vẫn
    # thành công, nên nhìn từ ngoài rất giống lỗi mạng hoặc tường lửa.
    #
    # `${PUBLIC_DOMAIN:-:80}` vá đúng chỗ: `:-` của Compose coi rỗng NHƯ LÀ chưa đặt — khác hẳn
    # Caddy — nên container luôn nhận một địa chỉ site hợp lệ. Đặt domain vào .env thì nó vẫn
    # thắng như cũ. Đã kiểm chứng bằng `caddy validate` ở cả ba trường hợp: rỗng, `:80`, domain.
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-:80}"
      # Khối MinIO trong Caddyfile ĐANG được bật (files.elitenexus.id.vn). Dòng `{$MINIO_PUBLIC_DOMAIN}`
      # ở đó không có giá trị mặc định nào đỡ cho, nên một giá trị RỖNG làm dòng địa chỉ site rút lại
      # còn ` {` và giết cả tiến trình Caddy — kéo sập luôn site chính.
      #
      # `:?` (khác `:-`) bắt Compose DỪNG với thông báo rõ ràng nếu biến chưa đặt hoặc rỗng, thay vì
      # để container lên rồi Caddy chết trong vòng lặp restart. deploy.yml đã kiểm tra secret này ở
      # nhóm bắt buộc; đây là lớp chặn thứ hai cho lần `docker compose up` chạy tay trên máy chủ.
      MINIO_PUBLIC_DOMAIN: "${MINIO_PUBLIC_DOMAIN:?chua dat trong .env - khoi MinIO trong Caddyfile dang bat, bien rong se lam sap Caddy}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # service_healthy, không phải depends_on trần. Dạng trần chỉ đợi container được TẠO, mà
      # backend cần khoảng một phút để Flyway chạy hết 44 migration và Spring nạp xong context —
      # trong khoảng đó Caddy đã nhận request và trả 502 cho mọi người vào trang.
      backend:
        condition: service_healthy
      web-ui:
        condition: service_started
    restart: always
    networks:
      - app-network

  # ─── Application Services ───
  backend:
    # Tag do workflow deploy của repo backend ghi vào .env (`BACKEND_IMAGE_TAG=<sha>`) sau khi
    # image đã qua test và container đã báo healthy. Đó là con trỏ tới ĐÚNG bản đang phục vụ.
    #
    # Vì sao không để `:latest` như trước: `latest` được gắn lại mỗi lần build từ main, nên nó là
    # một cái tên chạy — file compose này nói "backend", còn thứ thực sự khởi động là bất kỳ bản
    # nào GHCR đang trỏ tới lúc `pull` chạy. Hệ quả cụ thể: không có mốc để quay lui khi bản mới
    # hỏng, và một lần `pull` vì lý do không liên quan (deploy infra, dựng lại máy chủ) cũng đủ
    # đổi phiên bản backend của production.
    #
    # `:-latest` giữ nguyên hành vi cũ khi .env chưa có biến này — máy chủ chưa từng deploy bằng
    # workflow mới vẫn lên được bình thường, không phải đặt biến trước.
    #
    # ⚠️ web-ui bên dưới CỐ Ý vẫn là `:latest`: workflow của repo frontend tự deploy chính nó và
    # chưa ghi tag nào vào .env. Thêm `${WEBUI_IMAGE_TAG:-latest}` ở đây mà không sửa repo đó thì
    # chỉ có thêm một biến không ai ghi — trông như đã ghim trong khi không.
    image: ghcr.io/truccoder/backend:${BACKEND_IMAGE_TAG:-latest}
    mem_limit: 1024m
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      AXIOM_DATASET: ${AXIOM_DATASET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_EMAIL: ${MAIL_USERNAME}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SocialApp}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # No default in application.yml — the backend refuses to start without it.
      JWT_SECRET: ${JWT_SECRET}
      # Khoá AES-256 mã hoá các cột chứa token OAuth của bên thứ ba: access token GitHub, và cặp
      # access/refresh token Google Calendar. Không phải khoá của dịch vụ nào bên ngoài — nó do
      # chính dự án sinh ra, và chỉ backend này dùng để mã hoá rồi giải mã cột của chính nó.
      #
      # Vì sao mã hoá chứ không băm như JWT/refresh token: ứng dụng phải GỬI LẠI những token này
      # cho GitHub và Google, nên bắt buộc đọc ngược ra được. Băm thì mất luôn khả năng dùng.
      #
      # Thứ bị lộ nếu để thô không phải tài khoản trong ứng dụng này, mà là tài khoản của người
      # dùng Ở DỊCH VỤ KHÁC: token GitHub mang scope user:email (đọc được email riêng tư họ đã ẩn),
      # token Google mang calendar.events (đọc/ghi lịch). Nặng nhất là REFRESH token của Google —
      # nó không hết hạn cho tới khi người dùng tự thu hồi, tức là quyền vào lịch VĨNH VIỄN, nằm
      # trong một CSDL dùng chung pooler Supabase.
      #
      # Để trống KHÔNG làm backend chết: chỉ việc liên kết GitHub/Google trả 503 kèm thông báo rõ
      # ràng, phần còn lại chạy bình thường. Nhưng nó nằm trong nhóm bắt buộc của deploy.yml —
      # xem lý do ở đó.
      COLUMN_ENCRYPTION_KEY: ${COLUMN_ENCRYPTION_KEY}
      # The OpenAPI spec enumerates every endpoint and DTO field, and Swagger UI is a live
      # request console — both stay off in production (see application.yml).
      SPRINGDOC_ENABLED: "false"
      # Content moderation. application.yml already defaults this on; stated here so that "is
      # production moderating posts?" is answerable from the compose file without going and
      # reading the image's defaults. Never set this to false here.
      MODERATION_ENABLED: "true"
      # Production CÓ nạp dữ liệu demo (quyết định 2026-08-21).
      #
      # KHÔNG bao giờ thêm `classpath:db/seed-dev` vào đây. Thư mục đó chứa personal access token
      # dùng được ngay cho /v1/api/knowledge/sync/**, tức là credential thật.
      #
      # Mật khẩu của 60 tài khoản seed được GHI CỨNG trong V51__seed_users.sql, không đến từ biến
      # môi trường nào (quyết định 2026-08-21: chấp nhận để khỏi quản lý thêm secret). Nghĩa là
      # mật khẩu ADMIN của môi trường này nằm công khai trong repo backend — xem chính file đó.
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      # Đồ thị bạn bè sống ở Neo4j và là thứ /friendships cùng /suggestions THỰC SỰ đọc; Flyway chỉ
      # quản Postgres. Không có cờ này thì sau khi nạp seed, Postgres có hàng nghìn lời mời đã chấp
      # nhận trong khi Neo4j trống trơn — hồ sơ hiện "đã là bạn" còn danh sách bạn bè thì rỗng, và
      # không có gì báo lỗi.
      #
      # An toàn để bật thường trực: Neo4jSeedInitializer bỏ qua khi đồ thị đã có node User.
      NEO4J_SEED_ON_START: ${NEO4J_SEED_ON_START:-true}
      # Guest rate limiting counts per client IP. Behind Caddy, every request arrives from the
      # proxy's container address, so with this off the ENTIRE anonymous internet shares one
      # 60-requests-per-minute bucket — real visitors get 429s while a crawler is never isolated.
      #
      # Safe to trust the header here specifically: Caddy's reverse_proxy overwrites
      # X-Forwarded-For rather than appending to a client-supplied value, and the backend
      # publishes no port of its own, so Caddy is the only path in. Both facts have to stay true
      # for this to remain correct — do not publish backend ports.
      GUEST_RATE_LIMIT_TRUST_XFF: "true"
      RESET_PASSWORD_URL: ${PUBLIC_BASE_URL}/reset-password?token=
      VERIFY_EMAIL_URL: ${PUBLIC_BASE_URL}/verify-email?token=
      MAGIC_LINK_URL: ${PUBLIC_BASE_URL}/magic-login?token=
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL}
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?user=postgres.rjauctcerrnmacrhaixx&password=${DB_PASSWORD}&sslmode=require
      SPRING_DATASOURCE_USERNAME: postgres.rjauctcerrnmacrhaixx
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
      # MinIO must be reached at the SAME address the backend uses to sign presigned URLs,
      # because that address gets baked into t_users.profile_picture_url / t_books.cover_image_url
      # and served to real browsers — "minio" (Docker-internal DNS) would be unreachable from them.
      #
      # ⚠️ Từ khi giá trị này là https://files.elitenexus.id.vn (đi qua Caddy), backend đi ĐƯỜNG VÒNG
      # qua Caddy để tới MinIO. MinIOBucketInitializer chạy ở ApplicationReadyEvent, và lúc đó Caddy
      # có thể CHƯA lên (caddy `depends_on` backend `service_healthy`). Lần chạy đó sẽ log ERROR
      # "Could not prepare MinIO bucket" và bỏ qua — KHÔNG làm backend chết, nhưng policy public-read
      # của hai bucket ảnh cũng chưa được đặt. Sau lần deploy cắt domain ĐẦU TIÊN, chạy một lần:
      #   docker compose -f docker-compose.prod.yml restart backend
      # để initializer chạy lại khi Caddy đã sẵn sàng. Các lần deploy sau không cần (volume đã có
      # bucket + policy).
      MINIO_URL: ${MINIO_PUBLIC_URL}
      # The backend authenticates to MinIO as root, so these are the same two values the minio
      # service below is started with. They were literal defaults in this file until 2026-08-18 —
      # published credentials on a port open to the internet, i.e. read/write/delete on every
      # avatar, book cover and preview file. Now .env-only (deploy.yml ghi từ GitHub Secrets).
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # OAuth / Google Calendar. The callback the *browser* is redirected to lives on the
      # web-ui (/oauth/*); the Calendar callback is consumed by the backend itself, so it
      # goes through Caddy's /v1/* route. Both must be registered verbatim in the Google /
      # GitHub app consoles.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${PUBLIC_BASE_URL}/oauth/google/callback
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: ${PUBLIC_BASE_URL}/oauth/github/callback
      # Route RIÊNG cho luồng "liên kết GitHub vào tài khoản đang đăng nhập", khác hẳn route đăng
      # nhập ở trên. Code GitHub chỉ dùng được một lần, nên nếu hai luồng chung một callback thì
      # handler đăng nhập tiêu mất code mà luồng liên kết đang cần — đó chính là bug B23a.
      #
      # Biến này bị BỎ SÓT cho tới 2026-08-21: production rơi về mặc định dành cho máy dev là
      # http://localhost:3000/settings/github/callback, nên bấm "liên kết GitHub" trên production
      # đá trình duyệt người dùng về localhost. Không có lỗi nào trong log backend vì backend
      # không phải bên thực hiện việc chuyển hướng đó.
      #
      # Phải đăng ký thêm URI này trong GitHub OAuth App, bên cạnh URI đăng nhập.
      GITHUB_OAUTH_LINK_REDIRECT_URI: ${PUBLIC_BASE_URL}/settings/github/callback
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET}
      GOOGLE_CALENDAR_REDIRECT_URI: ${PUBLIC_BASE_URL}/v1/api/events/google/callback
      # The web-ui talks to Stream Chat directly with the token GET /v1/api/chat/token issues,
      # so the backend needs the real credentials — an empty key makes chat unusable.
      STREAM_API_KEY: ${STREAM_API_KEY}
      STREAM_API_SECRET: ${STREAM_API_SECRET}
      # Push notification (OneSignal). Bị BỎ SÓT hoàn toàn cho tới 2026-08-22: không có ở đây
      # lẫn ở deploy.yml, nên application.yml rơi về default rỗng.
      #
      # Cách hỏng rất khó thấy: PushNotificationService dựng WebClient với header
      # `Authorization: Basic null` rồi gọi Map.of("app_id", null, ...) — NPE, nhưng nằm trong
      # try/catch nên chỉ để lại một dòng log.error. Không có ngoại lệ nào nổi lên tới API, và
      # thông báo trong ứng dụng qua SSE vẫn chạy bình thường, nên nhìn từ ngoài mọi thứ trông
      # như đang hoạt động trong khi KHÔNG có push nào rời khỏi máy chủ.
      #
      # Để trống là hợp lệ và đúng ý nếu chưa đăng ký OneSignal — chỉ mất push, phần còn lại của
      # hệ thống thông báo không phụ thuộc vào nó.
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
      # ⚠️ THANH TOÁN LÀ DEMO — QUYẾT ĐỊNH CHÍNH THỨC 2026-08-18, GIỮ SANDBOX.
      #
      # Bốn giá trị dưới đây là credential sandbox MoMo tự công bố
      # (github.com/momo-wallet/payment). Ghi thẳng ở đây thay vì để mặc định trong
      # application.yml, để nhìn riêng file compose là biết ngay production đang trỏ vào
      # test-payment.momo.vn và KHÔNG nhận đồng tiền thật nào.
      #
      # Hệ quả cần nhớ khi cho người ngoài đội dùng thử: bấm "mua sách" vẫn hiện giao dịch thành
      # công và tải được sách, nhưng không có tiền nào được chuyển. Phải nói rõ đó là demo.
      #
      # Phía code đã sẵn sàng cho merchant thật — chữ ký IPN được verify và webhook xử lý
      # idempotent (MomoService.handleWebhook / applyResult), đã rà ngày 2026-08-18. Muốn lên
      # thật thì chỉ thay bốn giá trị này qua .env, không phải sửa code.
      #
      # Bốn dòng dưới là LITERAL cho tới 2026-08-22, và `environment:` thắng `env_file:` trong
      # Compose — nghĩa là đặt MOMO_PARTNER_CODE vào .env sẽ bị nuốt im lặng, đúng ngược với
      # điều đoạn ghi chú ngay trên vừa hứa. Dạng ${VAR:-default} giữ nguyên hành vi mặc định
      # (không có .env thì vẫn là sandbox MoMo) nhưng .env override được thật.
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMO}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-F8BBA842ECF85}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-K951B6PE1waDMi640xX08PD3vg6EkVlz}
      MOMO_API_URL: ${MOMO_API_URL:-https://test-payment.momo.vn}
      # Luồng MoMo hiển thị cho người mua. Đặt `payWithATM` (màn hình nhập thẻ) theo yêu cầu demo
      # trên VPS — trùng mặc định của repo backend (application.yml).
      #
      # ⚠️ Đánh đổi: trên sandbox MoMo (MOMO_API_URL vẫn là test-payment.momo.vn) luồng thẻ đậu ở
      # resultCode 7002 và KHÔNG BAO GIỜ tự settle — đơn tạo được, người mua vẫn được chuyển sang
      # MoMo, rồi trạng thái đứng nguyên PENDING mãi mãi (MomoService coi 7002 là "đang bay", không
      # log lỗi, không mã lỗi). POST /v1/api/payments/{ref}/dev-settle gỡ được nhưng mang
      # @Profile("dev") nên không tồn tại ở đây. Đổi lại `captureWallet` (ví/QR — giá trị duy nhất
      # đo được settle trên sandbox) nếu cần luồng mua chạy trọn vẹn tới COMPLETED.
      MOMO_REQUEST_TYPE: ${MOMO_REQUEST_TYPE:-payWithATM}
      MOMO_REDIRECT_URL: ${PUBLIC_BASE_URL}/payment/success
      MOMO_IPN_URL: ${PUBLIC_BASE_URL}/v1/api/payments/momo/webhook
    depends_on:
      # Redis và Neo4j phải thực sự trả lời được trước khi backend khởi động, không chỉ là
      # "container đã được tạo". Postgres không có ở đây vì nó nằm ở Supabase, ngoài compose này.
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  web-ui:
    image: ghcr.io/truccoder/web-ui:latest
    mem_limit: 448m
    environment:
      NEXT_PUBLIC_USE_MOCK: "false"
      # KHÔNG có biến nào của Stream Chat ở đây, và đó là đúng: frontend nhận cả apiKey lẫn token
      # từ backend qua GET /v1/api/chat/token (xem ChatTokenResponse), nên khoá không cần đi vòng
      # qua biến môi trường của web-ui.
      #
      # Bốn biến TWILIO_* từng nằm ở đây đã được gỡ (28/08): chat chuyển sang Stream Chat từ lâu,
      # frontend không còn phụ thuộc twilio trong package.json và mọi nhắc tới Twilio trong mã chỉ
      # còn là chú thích giải thích cái đã bị thay. Truyền một secret không ai đọc là rủi ro thuần.
    restart: always
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    mem_limit: 192m
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - app-network

  neo4j:
    image: neo4j:5.20
    mem_limit: 640m
    environment:
      # Not published to the host, so this was never reachable from the internet — but it is the
      # store of record for the friendship graph, and "neo4j_password" was a default sitting in a
      # git repo. Anything that reaches the docker network gets the whole social graph with it.
      #
      # ⚠️ BIẾN NÀY CHỈ CÓ TÁC DỤNG LẦN ĐẦU, khi volume neo4j_data còn trống.
      #
      # Với volume đã có dữ liệu, Neo4j đọc mật khẩu từ /data/dbms/auth.ini và BỎ QUA biến này. Nó
      # không báo lỗi, chỉ ghi đúng một dòng log dễ trôi qua:
      #
      #   Changed password for user 'neo4j'. IMPORTANT: this change will only take effect if
      #   performed before the database is started for the first time.
      #
      # Nghĩa là ĐỔI NEO4J_PASSWORD KHÔNG ĐỦ để đổi mật khẩu của một Neo4j đang chạy. Volume trên
      # máy chủ được khởi tạo bằng "neo4j_password" — giá trị mặc định ghi cứng trong chính file
      # này cho tới 2026-08-18 — nên khi biến chuyển sang secret thì healthcheck bên dưới đăng nhập
      # bằng mật khẩu mới và trượt VĨNH VIỄN, đồng thời backend cũng không kết nối được Bolt.
      #
      # Đây là bẫy tiềm ẩn cho lần xoay secret TỚI, không phải nguyên nhân sự cố 2026-08-22 (sự cố
      # đó là Caddyfile — xem ghi chú ở service caddy). Hệ quả nếu vấp phải: backend không mở được
      # Bolt và không bao giờ khởi động, trong khi log Neo4j vẫn báo "Started." hoàn toàn bình thường.
      #
      # Muốn xoay mật khẩu thì phải đổi trong chính cơ sở dữ liệu, dữ liệu giữ nguyên:
      #
      #   NEW=$(grep -m1 '^NEO4J_PASSWORD=' .env | cut -d= -f2-)
      #   docker compose -f docker-compose.prod.yml exec -T neo4j       #     cypher-shell -u neo4j -p '<mật-khẩu-cũ>' -d system       #     "ALTER CURRENT USER SET PASSWORD FROM '<mật-khẩu-cũ>' TO '$NEW'"
      #
      # Đã kiểm chứng trên neo4j:5.20 Community ngày 2026-08-22: lệnh chạy được, dữ liệu còn
      # nguyên, mật khẩu mới sống qua restart. Phải là ALTER CURRENT USER — ALTER USER cần
      # Enterprise. Xoá volume cũng "sửa" được, nhưng mất toàn bộ đồ thị quan hệ bạn bè.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Chạy hẳn một câu truy vấn, không chỉ kiểm tra cổng: Neo4j từ chối kết nối Bolt trong vài
      # giây sau khi tiến trình đã lên, nên "cổng đang mở" không đồng nghĩa với "trả lời được".
      #
      # Mật khẩu dùng `${...}` một dấu $ — Compose thay giá trị từ .env ngay lúc đọc file, chứ
      # KHÔNG phải `$$` để container tự tra biến môi trường.
      #
      # Lý do: entrypoint của Neo4j coi mọi biến bắt đầu bằng NEO4J_ là một setting trong
      # neo4j.conf. Thêm `NEO4J_PASSWORD` vào environment làm nó báo "Unrecognized setting. No
      # declared setting with name: PASSWORD" rồi thoát — container vào vòng lặp khởi động lại và
      # không bao giờ lên được. Đã thử và dính đúng lỗi này.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: always
    networks:
      - app-network

  minio:
    image: minio/minio
    mem_limit: 384m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      # /minio/health/live là endpoint sẵn có của MinIO, không cần xác thực. curl có trong image.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      # Từ 2026-08-31 MinIO đi qua Caddy tại files.elitenexus.id.vn (khối MINIO trong Caddyfile),
      # và MINIO_PUBLIC_URL trong .env trỏ vào đó. Cổng 9000 GIỮ MỞ như đường dự phòng trong lúc
      # chuyển đổi — nếu ảnh đại diện hoặc link tải sách hỏng qua hostname mới thì đổi tạm
      # MINIO_PUBLIC_URL về http://3.105.195.84:9000 là quay lại được ngay.
      #
      # Đóng cổng này SAU KHI đã xác nhận qua hostname mới:
      #   1. Mở một hồ sơ có ảnh đại diện — ảnh phải hiện (URL https://files.elitenexus.id.vn/...).
      #   2. Mua thử rồi tải một cuốn sách — presigned URL phải tải được.
      # rồi bỏ dòng "9000:9000" này và `docker compose -f docker-compose.prod.yml up -d minio caddy`.
      #
      # Chỉ bucket `profile-pictures` và `post-media` là public-read (MinIOBucketInitializer); books
      # và book-covers là private, phát qua presigned URL. Cổng console (9001) cố ý không publish.
      - "9000:9000"
    volumes:
      - minio_data:/data
    restart: always
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  neo4j_data:
  minio_data:

networks:
  app-network:
    driver: bridge