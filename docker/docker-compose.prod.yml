services:
  # ─── Reverse Proxy ───
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web-ui
    restart: always
    networks:
      - app-network

  # ─── Application Services ───
  backend:
    image: ghcr.io/truccoder/backend:latest
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      AXIOM_DATASET: ${AXIOM_DATASET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RESET_PASSWORD_URL: http://14.225.217.4/reset-password?token=
      VERIFY_EMAIL_URL: http://14.225.217.4/verify-email?token=
      MAGIC_LINK_URL: http://14.225.217.4/magic-login?token=
      CORS_ALLOWED_ORIGINS: http://14.225.217.4
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?user=postgres.rjauctcerrnmacrhaixx&password=${DB_PASSWORD}&sslmode=require
      SPRING_DATASOURCE_USERNAME: postgres.rjauctcerrnmacrhaixx
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4j_password
      # MinIO must be reached at the SAME address the backend uses to sign presigned URLs,
      # because that address gets baked into t_users.profile_picture_url / t_books.cover_image_url
      # and served to real browsers — "minio" (Docker-internal DNS) would be unreachable from them.
      MINIO_URL: http://14.225.217.4:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin_password
      MOMO_REDIRECT_URL: http://14.225.217.4/payment/success
      MOMO_IPN_URL: http://14.225.217.4/v1/api/payments/momo/webhook
    depends_on:
      - redis
      - neo4j
      - minio
    restart: always
    networks:
      - app-network

  web-ui:
    image: ghcr.io/truccoder/web-ui:latest
    environment:
      NEXT_PUBLIC_USE_MOCK: "false"
    restart: always
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app-network

  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
    restart: always
    networks:
      - app-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_password
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    restart: always
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  neo4j_data:
  minio_data:

networks:
  app-network:
    driver: bridge