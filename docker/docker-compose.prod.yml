services:
  # ─── Reverse Proxy ───
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web-ui
    restart: always
    networks:
      - app-network

  # ─── Application Services ───
  backend:
    image: ghcr.io/truccoder/backend:latest
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      AXIOM_DATASET: ${AXIOM_DATASET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_EMAIL: ${MAIL_USERNAME}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SocialApp}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # No default in application.yml — the backend refuses to start without it.
      JWT_SECRET: ${JWT_SECRET}
      # The OpenAPI spec enumerates every endpoint and DTO field, and Swagger UI is a live
      # request console — both stay off in production (see application.yml).
      SPRINGDOC_ENABLED: "false"
      RESET_PASSWORD_URL: http://14.225.217.4/reset-password?token=
      VERIFY_EMAIL_URL: http://14.225.217.4/verify-email?token=
      MAGIC_LINK_URL: http://14.225.217.4/magic-login?token=
      CORS_ALLOWED_ORIGINS: http://14.225.217.4
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?user=postgres.rjauctcerrnmacrhaixx&password=${DB_PASSWORD}&sslmode=require
      SPRING_DATASOURCE_USERNAME: postgres.rjauctcerrnmacrhaixx
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4j_password
      # MinIO must be reached at the SAME address the backend uses to sign presigned URLs,
      # because that address gets baked into t_users.profile_picture_url / t_books.cover_image_url
      # and served to real browsers — "minio" (Docker-internal DNS) would be unreachable from them.
      MINIO_URL: http://14.225.217.4:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin_password
      # OAuth / Google Calendar. The callback the *browser* is redirected to lives on the
      # web-ui (/oauth/*); the Calendar callback is consumed by the backend itself, so it
      # goes through Caddy's /v1/* route. Both must be registered verbatim in the Google /
      # GitHub app consoles.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: http://14.225.217.4/oauth/google/callback
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: http://14.225.217.4/oauth/github/callback
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET}
      GOOGLE_CALENDAR_REDIRECT_URI: http://14.225.217.4/v1/api/events/google/callback
      # The web-ui talks to Stream Chat directly with the token GET /v1/api/chat/token issues,
      # so the backend needs the real credentials — an empty key makes chat unusable.
      STREAM_API_KEY: ${STREAM_API_KEY}
      STREAM_API_SECRET: ${STREAM_API_SECRET}
      # Payments are a demo on this deployment, not a live checkout: these are MoMo's own
      # publicly published sandbox credentials (github.com/momo-wallet/payment), spelled out
      # here rather than left to application.yml's defaults so it is visible from the compose
      # file alone that production is pointed at test-payment.momo.vn and takes no real money.
      # Replace all four with a real merchant's values — via .env, not in git — to go live.
      MOMO_PARTNER_CODE: MOMO
      MOMO_ACCESS_KEY: F8BBA842ECF85
      MOMO_SECRET_KEY: K951B6PE1waDMi640xX08PD3vg6EkVlz
      MOMO_API_URL: https://test-payment.momo.vn
      MOMO_REDIRECT_URL: http://14.225.217.4/payment/success
      MOMO_IPN_URL: http://14.225.217.4/v1/api/payments/momo/webhook
    depends_on:
      - redis
      - neo4j
      - minio
    restart: always
    networks:
      - app-network

  web-ui:
    image: ghcr.io/truccoder/web-ui:latest
    environment:
      NEXT_PUBLIC_USE_MOCK: "false"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET}
      TWILIO_CONVERSATIONS_SERVICE_SID: ${TWILIO_CONVERSATIONS_SERVICE_SID}
    restart: always
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app-network

  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
    restart: always
    networks:
      - app-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_password
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    restart: always
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  neo4j_data:
  minio_data:

networks:
  app-network:
    driver: bridge