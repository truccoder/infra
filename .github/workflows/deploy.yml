name: Deploy Infra Config

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xác thực SSH bằng khoá: VPS 3.105.195.84 là EC2, password auth tắt mặc định, đăng nhập
      # bằng file .pem. `password` để lại làm dự phòng — appleboy thử `key` trước rồi mới tới nó.
      # Secret phải có trên repo: SERVER_IP, SERVER_USER (ubuntu / ec2-user), SERVER_SSH_KEY (dán
      # nguyên nội dung file .pem, gồm cả dòng -----BEGIN/END-----). Thiếu SERVER_SSH_KEY (và
      # SERVER_PASSWORD) thì appleboy không có phương thức nào để thử: "unable to authenticate,
      # attempted methods [none]".
      - name: Install Docker on server (first run only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            sudo mkdir -p /opt/socialapp
            sudo chown $USER:$USER /opt/socialapp

      - name: Upload configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker/docker-compose.prod.yml,docker/Caddyfile"
          target: /opt/socialapp
          strip_components: 1

      - name: Start services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/socialapp

            echo "SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}" > .env.tmp

            # Địa chỉ công khai. Mọi URL người dùng nhìn thấy (link đặt lại mật khẩu, CORS,
            # redirect URI của OAuth) đều dựng từ đây.
            #   PUBLIC_BASE_URL=https://elitenexus.id.vn   PUBLIC_DOMAIN=elitenexus.id.vn
            #   MINIO_PUBLIC_URL=https://files.elitenexus.id.vn   MINIO_PUBLIC_DOMAIN=files.elitenexus.id.vn
            echo "PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}" >> .env.tmp
            echo "PUBLIC_DOMAIN=${{ secrets.PUBLIC_DOMAIN }}" >> .env.tmp
            echo "MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}" >> .env.tmp
            # Hostname Caddy dùng cho khối reverse-proxy MinIO (files.elitenexus.id.vn). Khối đó
            # trong Caddyfile ĐÃ được bỏ comment — một giá trị rỗng ở đây làm dòng địa chỉ site rút
            # lại còn ` {` và giết cả tiến trình Caddy, kéo sập luôn site chính. Vì vậy biến này
            # nằm ở nhóm BẮT BUỘC bên dưới: thiếu secret thì deploy dừng và .env cũ được giữ nguyên.
            echo "MINIO_PUBLIC_DOMAIN=${{ secrets.MINIO_PUBLIC_DOMAIN }}" >> .env.tmp

            # Credential của hạ tầng. Tới 2026-08-18 chúng là giá trị mặc định ghi thẳng trong
            # docker-compose.prod.yml đã commit; giờ chỉ đến từ secrets.
            echo "MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}" >> .env.tmp
            echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}" >> .env.tmp
            echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}" >> .env.tmp

            echo "AXIOM_TOKEN=${{ secrets.AXIOM_TOKEN }}" >> .env.tmp
            echo "AXIOM_DATASET=${{ secrets.AXIOM_DATASET }}" >> .env.tmp
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.tmp
            echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env.tmp
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env.tmp
            echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env.tmp
            echo "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> .env.tmp
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.tmp
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.tmp
            echo "COLUMN_ENCRYPTION_KEY=${{ secrets.COLUMN_ENCRYPTION_KEY }}" >> .env.tmp
            echo "GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" >> .env.tmp
            echo "GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" >> .env.tmp
            # Tên secret là GH_*, tên biến môi trường vẫn là GITHUB_OAUTH_* — KHÔNG phải sơ suất.
            # GitHub từ chối tạo secret có tiền tố GITHUB_ (tiền tố dành riêng cho hệ thống), nên
            # Một secret mang chính tên đó KHÔNG BAO GIỜ có giá trị: nó luôn nở ra chuỗi rỗng
            # và workflow vẫn xanh. Đó là lý do đăng nhập bằng GitHub hỏng trên production kể từ
            # ngày đầu mà không có lỗi nào ở bất cứ đâu. Backend vẫn đọc GITHUB_OAUTH_CLIENT_ID,
            # nên chỉ đổi phía secret.
            echo "GITHUB_OAUTH_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}" >> .env.tmp
            echo "GITHUB_OAUTH_CLIENT_SECRET=${{ secrets.GH_OAUTH_CLIENT_SECRET }}" >> .env.tmp
            echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env.tmp
            echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env.tmp
            echo "STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}" >> .env.tmp
            echo "STREAM_API_SECRET=${{ secrets.STREAM_API_SECRET }}" >> .env.tmp

            # Push notification. Bỏ trống được — chỉ mất push, thông báo trong ứng dụng qua SSE
            # không phụ thuộc vào đây, nên hai biến này nằm ở nhóm TUỲ CHỌN của bước kiểm tra bên
            # dưới. Bị bỏ sót hoàn toàn cho tới 2026-08-22.
            echo "ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}" >> .env.tmp
            echo "ONESIGNAL_REST_API_KEY=${{ secrets.ONESIGNAL_REST_API_KEY }}" >> .env.tmp
            echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env.tmp
            echo "TWILIO_API_KEY_SID=${{ secrets.TWILIO_API_KEY_SID }}" >> .env.tmp
            echo "TWILIO_API_KEY_SECRET=${{ secrets.TWILIO_API_KEY_SECRET }}" >> .env.tmp
            echo "TWILIO_CONVERSATIONS_SERVICE_SID=${{ secrets.TWILIO_CONVERSATIONS_SERVICE_SID }}" >> .env.tmp

            # ─── Giữ lại tag image mà backend đã ghim ──────────────────────────────────────
            #
            # BACKEND_IMAGE_TAG KHÔNG đến từ secrets: workflow deploy của repo backend ghi nó vào
            # .env trên máy chủ sau mỗi lần deploy thành công, và docker-compose.prod.yml đọc nó.
            #
            # File .env ở đây được dựng LẠI TỪ ĐẦU mỗi lần chạy. Không đọc lại giá trị cũ nghĩa là
            # mỗi lần deploy infra — kể cả khi chỉ sửa một dòng trong Caddyfile — sẽ âm thầm kéo
            # production về `:latest`, tức là về một image KHÁC với bản vừa được kiểm tra, đồng
            # thời xoá luôn mốc quay lui. Đúng cái bẫy mà việc ghim tag sinh ra để tránh.
            #
            # `|| true`: lần chạy đầu tiên chưa có .env, và chưa ghim tag cũng là trạng thái hợp lệ.
            KEEP_TAG="$(grep -m1 '^BACKEND_IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2- || true)"
            if [ -n "$KEEP_TAG" ]; then
              echo "BACKEND_IMAGE_TAG=$KEEP_TAG" >> .env.tmp
              echo "::notice::Giữ nguyên BACKEND_IMAGE_TAG=$KEEP_TAG mà backend đã ghim."
            else
              echo "::notice::Chưa có BACKEND_IMAGE_TAG trong .env — backend sẽ chạy tag :latest."
            fi

            # ─── Kiểm tra secret rỗng ──────────────────────────────────────────────────────
            #
            # Một dòng echo lấy giá trị từ một secret CHƯA ĐƯỢC TẠO không làm workflow hỏng:
            # GitHub thay bằng chuỗi rỗng, dòng `X=` vẫn được ghi, container vẫn lên, và cấu hình
            # sai một cách hoàn toàn im lặng. Đây là cách hỏng đắt nhất của toàn bộ pipeline này —
            # deploy báo xanh trong khi JWT_SECRET rỗng hoặc DB_PASSWORD rỗng.
            #
            # Vì vậy mọi thứ ở trên ghi vào .env.tmp, và chỉ file đã qua kiểm tra mới được đặt vào
            # chỗ của .env. Hỏng ở đây nghĩa là deployment đang chạy giữ nguyên .env cũ còn tốt,
            # thay vì bị thay bằng một file thiếu.
            missing=""

            # Danh sách dựng bằng phép nối chuỗi chứ không bằng dấu gạch chéo nối dòng: file này
            # nằm trong working tree Windows (core.autocrlf=true), và một dòng nối kết thúc bằng
            # CR sẽ làm shell trên máy chủ Linux báo lỗi cú pháp ngay giữa lúc deploy.
            required="SPRING_PROFILES_ACTIVE PUBLIC_BASE_URL MINIO_PUBLIC_URL MINIO_PUBLIC_DOMAIN"
            required="$required MINIO_ROOT_USER MINIO_ROOT_PASSWORD NEO4J_PASSWORD"
            required="$required AXIOM_TOKEN AXIOM_DATASET DB_PASSWORD JWT_SECRET"
            required="$required MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD"
            required="$required GEMINI_API_KEY STREAM_API_KEY STREAM_API_SECRET"
            required="$required GITHUB_OAUTH_CLIENT_ID GITHUB_OAUTH_CLIENT_SECRET PUBLIC_DOMAIN"

            # COLUMN_ENCRYPTION_KEY nằm ở nhóm BẮT BUỘC, không phải nhóm cảnh báo, và đó là một
            # quyết định — để trống thì backend vẫn lên, chỉ việc liên kết GitHub/Google trả 503.
            #
            # Lý do xếp vào bắt buộc: GITHUB_OAUTH_* đã ở nhóm này, nghĩa là tính năng GitHub được
            # coi là phải chạy được. Thiếu khoá thì nó không chạy, và hỏng theo đúng kiểu file này
            # đã hai lần phải sửa hậu quả: deploy xanh, không lỗi ở đâu, người dùng bấm liên kết
            # rồi nhận 503 mà không ai biết. Sinh khoá tốn đúng một câu lệnh:
            #
            #   openssl rand -base64 32
            #
            # rồi lưu vào GitHub secret COLUMN_ENCRYPTION_KEY.
            #
            # ⚠️ ĐỔI KHOÁ = MẤT TOÀN BỘ TOKEN ĐÃ MÃ HOÁ. Không có đường khôi phục; người dùng phải
            # liên kết lại GitHub/Google. Sinh một lần rồi giữ, đừng sinh lại mỗi lần deploy.
            required="$required COLUMN_ENCRYPTION_KEY"

            for v in $required; do
              if [ -z "$(grep -m1 "^${v}=" .env.tmp | cut -d= -f2-)" ]; then
                missing="${missing} ${v}"
              fi
            done

            # Nhóm TUỲ CHỌN: rỗng là một trạng thái hợp lệ, chỉ cảnh báo.
            #   GOOGLE_OAUTH_*    — rỗng = không đăng nhập bằng Google được
            #   GOOGLE_CALENDAR_* — rỗng = không đồng bộ sự kiện sang Google Calendar được
            #   ONESIGNAL_*       — rỗng = không có push
            #   TWILIO_*          — frontend hiện KHÔNG dùng tới (chat qua Stream, gọi PeerJS)
            #
            # Bốn biến Google nằm ở nhóm cảnh báo là một QUYẾT ĐỊNH, không phải bỏ sót (2026-08-22).
            # Chúng đã rỗng từ trước khi có bước kiểm tra này — compose luôn lấy chúng từ ${...} và
            # secret thì chưa bao giờ được tạo — nên đăng nhập Google và Calendar hỏng trên
            # production ngay từ đầu. Để ở nhóm bắt buộc nghĩa là chặn mọi lần deploy vì một tính
            # năng vốn đã chết, tức là phạt những thay đổi không liên quan. Điền secret vào là hết
            # cảnh báo; chừng nào còn cảnh báo thì đó vẫn là trạng thái thật của production.
            #
            # GITHUB_OAUTH_* CỐ Ý ở lại nhóm bắt buộc: đăng nhập bằng GitHub là luồng chính của sản
            # phẩm, và giờ đã có tên secret dùng được (GH_OAUTH_*) nên không còn lý do để trống.
            #
            # PUBLIC_DOMAIN nằm ở nhóm BẮT BUỘC từ 2026-08-31: dự án đã chuyển hẳn sang domain
            # elitenexus.id.vn + HTTPS. PUBLIC_BASE_URL là https://elitenexus.id.vn, nên một
            # PUBLIC_DOMAIN rỗng để Caddy nghe cổng 80 HTTP thuần trong khi backend dựng link https
            # và CORS chờ origin https — đăng nhập hỏng mà deploy vẫn xanh.
            optional="GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET"
            optional="$optional GOOGLE_CALENDAR_CLIENT_ID GOOGLE_CALENDAR_CLIENT_SECRET"
            optional="$optional ONESIGNAL_APP_ID ONESIGNAL_REST_API_KEY"
            optional="$optional TWILIO_ACCOUNT_SID TWILIO_API_KEY_SID"
            optional="$optional TWILIO_API_KEY_SECRET TWILIO_CONVERSATIONS_SERVICE_SID"

            for v in $optional; do
              if [ -z "$(grep -m1 "^${v}=" .env.tmp | cut -d= -f2-)" ]; then
                echo "::warning::${v} rỗng — tính năng phụ thuộc vào nó sẽ không hoạt động."
              fi
            done

            if [ -n "$missing" ]; then
              echo "::error::Thiếu GitHub secret (giá trị rỗng):${missing}"
              echo "Thêm ở Settings → Secrets and variables → Actions, rồi chạy lại workflow."
              rm -f .env.tmp
              exit 1
            fi

            mv .env.tmp .env

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u truccoder --password-stdin
            docker compose -f docker-compose.prod.yml pull backend web-ui
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            # ─── Kiểm tra trang có thật sự phục vụ được không ────────────────────────────────
            #
            # `up -d` trả về 0 chỉ nghĩa là Compose đã làm xong việc của nó, KHÔNG nghĩa là có ai
            # đang nghe cổng 80. Ngày 2026-08-22, Caddy hoàn toàn không được tạo — nó chờ backend
            # healthy, backend chờ Neo4j healthy, Neo4j thì đăng nhập bằng mật khẩu mới trong khi
            # volume vẫn giữ mật khẩu cũ — và deploy vẫn kết thúc êm. Lỗi chỉ lộ ra khi có người
            # mở trình duyệt và nhận ERR_CONNECTION_REFUSED, tức là không có cảnh báo nào giữa
            # lúc deploy và lúc người dùng phát hiện.
            #
            # Vòng lặp chứ không phải một phát: backend cần khoảng một phút cho Flyway, và bước
            # này phải hỏng khi trang thật sự chết, chứ không phải khi nó lên chậm.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 5 http://localhost/; then
                echo "::notice::Cổng 80 phục vụ được sau khoảng $((i * 5))s."
                exit 0
              fi
              sleep 5
            done

            echo "::error::Cổng 80 không phục vụ sau 150s — trang đang chết dù deploy đã chạy xong."
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 40 caddy backend neo4j
            exit 1
